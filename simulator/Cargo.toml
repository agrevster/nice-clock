[package]
name = "simulator"
version = "0.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "now"] }
clap = { version = "4.6.7", default-features = false, features = ["color", "derive", "help", "std", "string", "usage"] }
common = { version = "0.0.0", path = "../common" }
log = { version = "0.4.33", features = ["std"] }
sdl2 = "0.38.0"
simplelog = "0.12.2"
strum = { version = "0.28.0", features = ["derive"] }
time = "0.3.53"
